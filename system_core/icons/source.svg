<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>Audion VS Engine</title>
  <desc>A cyan film television with three perforations on each side and an optically centered warm PLAY symbol. Antennas and feet are visible sections of two continuous straight diagonal supports behind the body. Flat saturated gradients.</desc>
