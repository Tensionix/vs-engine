<linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0.000" stop-color="#65E6FF"/><stop offset="0.500" stop-color="#18B6EE"/><stop offset="1.000" stop-color="#147BE8"/></linearGradient>
<linearGradient id="warm" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0.000" stop-color="#FFD152"/><stop offset="0.500" stop-color="#FF8B31"/><stop offset="1.000" stop-color="#F2554D"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#tile)"/>
