  # ==================================================================================================================
  - id: profiles
    title: "PROFILES"
    title_ru: "ПРОФИЛИ"
    fields: *machine
    children:
      - id: profile_run
        title: "Run a profile"
        title_ru: "Запустить профиль"
        about: "A saved preset with its settings"
        about_ru: "Сохранённый пресет с его настройками"
        description: "A profile - a preset with its settings and its encoder, saved under a name - run on a file or on a whole folder."
        description_ru: "Профиль - пресет с настройками и кодером, сохранённый под именем, - запускается на файле или на всей папке."
        service: "system_core.services.vs_service:profile_run"
        accel: "any"
        fields:
          - id: profile
            type: "radio"
            choice_style: "buttons"
            refresh_on_change: true
            label: "Profile"
            label_ru: "Профиль"
            tooltip: "The profiles of config\\profiles. Choosing one sets its encoder on the cards."
            tooltip_ru: "Профили из config\\profiles. Выбор профиля ставит его кодер на карточки."
            options_source: "system_core.services.vs_service:profile_options"

      - id: profile_save
        title: "Save a profile"
        title_ru: "Сохранить профиль"
        about: "The form of a preset under a name"
        about_ru: "Форма пресета под именем"
        description: "The settings of a preset and the encoder of the cards saved as a profile in config\\profiles."
        description_ru: "Настройки пресета и кодер карточек сохраняются профилем в config\\profiles."
        service: "system_core.services.vs_service:profile_save"
        fields:
          - id: profile_name
            type: "text"
            required: true
            label: "Name"
            label_ru: "Имя"
            tooltip: "The name of the profile: Latin letters, digits, - and _."
            tooltip_ru: "Имя профиля: латинские буквы, цифры, - и _."
            default: ""
          - id: profile_preset
            type: "radio"
            hidden: true
            required: true
            label: "Preset"
            label_ru: "Пресет"
            tooltip: "The preset the profile runs."
            tooltip_ru: "Пресет, который запускает профиль."
            options_source: "system_core.services.vs_service:preset_options"
          - id: profile_values
            type: "text"
            hidden: true
            label: "Settings of the preset"
            label_ru: "Настройки пресета"
            tooltip: "The fields of the preset as JSON: {\"strength\": \"light\"}. A field not named takes its default."
            tooltip_ru: "Поля пресета в JSON: {\"strength\": \"light\"}. Поле, которого нет, берёт своё умолчание."
            default: "{}"
          - id: profile_description
            type: "text"
            label: "Description"
            label_ru: "Описание"
            tooltip: "What the profile is for, a line."
            tooltip_ru: "Для чего профиль, одной строкой."
            default: ""

# The operations of SETUP and SERVICE in the header, and of DETAILS.
operations:
  - id: doctor
    title: "Doctor"
    title_ru: "Доктор"
    description: "Checks the whole engine: the two Pythons, VapourSynth, every plugin, FFmpeg, BM3D on the video card."
    description_ru: "Проверяет весь движок: оба Python, VapourSynth, каждый плагин, FFmpeg, BM3D на видеокарте."
    service: "system_core.services.vs_service:doctor"

  - id: probe_source
    title: "Source info"
    title_ru: "Сведения об Источнике"
    description: "What ffprobe knows of every video of the Source: size, frame rate, length, codec, range, colour."
    description_ru: "Что ffprobe знает о каждом видео Источника: размер, частота, длина, кодек, диапазон, цвет."
    service: "system_core.services.vs_service:probe_source"

  - id: source_list
    title: "File list"
    title_ru: "Список файлов"
    description: "The videos of the Source the next run takes, with their folders."
    description_ru: "Видео Источника, которые возьмёт следующий прогон, с их папками."
    service: "system_core.services.vs_service:source_list"

  - id: hardware_capabilities
    title: "Hardware capabilities"
    title_ru: "Возможности оборудования"
    description: "Short FFmpeg encodes with NVENC, QuickSync and AMF: which hardware encoders work on this machine."
    description_ru: "Короткие кодирования FFmpeg через NVENC, QuickSync и AMF: какие аппаратные кодеры работают на этой машине."
    service: "system_core.services.vs_service:hardware_capabilities"

  - id: bench_presets
    title: "Check every preset"
    title_ru: "Проверка всех пресетов"
    description: "Every preset on a test clip, a frame each: what runs on this machine and how fast."
    description_ru: "Каждый пресет на тестовом ролике по кадру: что работает на этой машине и как быстро."
    service: "system_core.services.vs_service:bench_presets"
    fields:
      - id: frames
        type: "number"
        label: "Frames"
        label_ru: "Кадров"
        tooltip: "How many frames every preset renders."
        tooltip_ru: "Сколько кадров считает каждый пресет."
        default: 1
        min: 1
        max: 100
        step: 1

  - id: bench_gpu
    title: "BM3D: video card or CPU"
    title_ru: "BM3D: видеокарта или процессор"
    description: "BM3D through Vulkan (bm3dvk) against BM3D on the CPU (bm3d) on the first video of the Source: frames a second of each."
    description_ru: "BM3D через Vulkan (bm3dvk) против BM3D на процессоре (bm3d) на первом видео Источника: кадров в секунду у каждого."
    service: "system_core.services.vs_service:bench_gpu"
    fields:
      - id: frames
        type: "number"
        label: "Frames"
        label_ru: "Кадров"
        tooltip: "How many frames each side renders."
        tooltip_ru: "Сколько кадров считает каждая сторона."
        default: 24
        min: 1
        max: 500
        step: 1

  - id: install_vapoursynth
    title: "Install VapourSynth"
    title_ru: "Установить VapourSynth"
    description: "The newest stable portable VapourSynth into system_core\\vapoursynth (step 10 of the builder)."
    description_ru: "Самый новый стабильный портативный VapourSynth в system_core\\vapoursynth (шаг 10 сборщика)."
    service: "system_core.services.vs_service:install_vapoursynth"

  - id: install_vs_plugins
    title: "Install the plugins"
    title_ru: "Установить плагины"
    description: "The plugins of install\\vs_plugins.json into VapourSynth (step 11 of the builder); the core is not moved."
    description_ru: "Плагины из install\\vs_plugins.json в VapourSynth (шаг 11 сборщика); ядро не сдвигается."
    service: "system_core.services.vs_service:install_vs_plugins"

  - id: install_ffmpeg
    title: "Install FFmpeg"
    title_ru: "Установить FFmpeg"
    description: "FFmpeg of Gyan into Tools\\ffmpeg by the NVIDIA driver: the newest stable, 9.0.2 at least, without an NVIDIA card and from the LTS driver 610.88; below it 8.0.1 (570-610.87) or 7.1 so that NVENC works, and not every operation is possible (step 13 of the builder)."
    description_ru: "FFmpeg от Gyan в Tools\\ffmpeg по драйверу NVIDIA: самая новая стабильная, не ниже 9.0.2, без карты NVIDIA и с LTS-драйвером 610.88 и новее; ниже него 8.0.1 (570-610.87) или 7.1, чтобы работал NVENC, и доступны не все операции (шаг 13 сборщика)."
    service: "system_core.services.vs_service:install_ffmpeg"

  - id: install_mlrt
    title: "Install MLRT"
    title_ru: "Установить MLRT"
    description: "vs-mlrt - TensorRT, ONNX Runtime and the models - into VapourSynth, trimmed to this video card: the neural presets DPIR, Real-ESRGAN and Soft HD Rebuild. Offered at the first start and in SETUP when an NVIDIA RTX card is found; the builder does not install it."
    description_ru: "vs-mlrt - TensorRT, ONNX Runtime и модели - в VapourSynth, под эту видеокарту: нейросетевые пресеты DPIR, Real-ESRGAN и Пересборка мягкого HD. Предлагается при первом запуске и в SETUP, когда найдена видеокарта NVIDIA RTX; сборщик его не ставит."
    service: "system_core.services.vs_service:install_mlrt"

  - id: remove_vapoursynth
    kind: "dangerous"
    title: "Remove VapourSynth"
    title_ru: "Удалить VapourSynth"
    description: "The folder of the engine, system_core\\vapoursynth, with its plugins and MLRT, goes to the Recycle Bin (step 14 of the builder)."
    description_ru: "Папка движка system_core\\vapoursynth с плагинами и MLRT уходит в Корзину (шаг 14 сборщика)."
    service: "system_core.services.vs_service:remove_vapoursynth"
