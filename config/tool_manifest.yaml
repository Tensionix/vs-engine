        about: "Soft HD rebuilt at twice the size"
        about_ru: "Мягкое HD, пересобранное вдвое"
        description: "A spectral cleanup, then Real-ESRGAN: soft and undersampled HD rebuilt at twice the size without its noise blown up."
        description_ru: "Спектральная чистка, затем Real-ESRGAN: мягкое и недоразрешённое HD пересобирается вдвое без раздутого шума."
