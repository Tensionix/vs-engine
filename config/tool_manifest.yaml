# Audion VS Engine: what the program can do.
#
# One source for the window, the console command (vs_cli.cmd) and the engine. An operation is a preset of a palette
# (its id is the name of its .vpy and is never renamed), a run of a profile, or a service of SERVICE. The registry of the
# engine (system_core\engine\presets.py) is read from here; the defaults of a .vpy (os.environ.get(..., "...")) stay for a
# bare vspipe and a test holds them to the defaults here.
#
# A field: id, type (radio | checkbox | number | text), label/label_ru, tooltip/tooltip_ru, default; a number has min,
# max and step (a whole step - a whole number); a choice - options with value, label/label_ru and a tooltip when it needs
# one. group names the block of the form: none - the parameters of the preset, processing, encoding, run.
# visible_if shows a field only when the form holds what it says.
#
# A palette (operation_groups) gives every preset under it its parameters (palette) and its fields after the preset's
# own: the machine - the processing and the cards of the encoder - and the run.
#
# A preset: title (its friendly name, Title Case), about (what it is for, a few words), description (what it does).
# accel: what of the preset the block PROCESSING moves - bm3d (BM3D: Vulkan or the CPU), mlrt (a neural network: TensorRT,
# DirectML or the CPU), any (a profile: whatever its preset has); without it the block is not shown - nothing of the preset
# runs anywhere but on the CPU. needs: mlrt - the preset runs on vs-mlrt, installed by SETUP when an NVIDIA RTX card
# is found; without RTX and without MLRT the window does not show it and the console refuses it with the reason.

tool:
  id: audion_vs_engine
  name: "Audion VS Engine"
  category: "Video"

# The words of PROCESSING by what the preset moves with it (accel of a preset); bm3d - the words of the field itself.
accel_texts:
  mlrt:
    tooltip: "Where the neural network runs. Auto: TensorRT on an NVIDIA RTX card, else DirectML on the video card, else the CPU."
    tooltip_ru: "Где работает нейросеть. Авто: TensorRT на видеокарте NVIDIA RTX, иначе DirectML на видеокарте, иначе процессор."
    options:
      cpu:
        tooltip: "The network on the CPU (ONNX Runtime): it works everywhere and is many times slower."
        tooltip_ru: "Нейросеть на процессоре (ONNX Runtime): работает везде и во много раз медленнее."
      gpu:
        tooltip: "The network on the video card: TensorRT on NVIDIA RTX, DirectML on another card."
        tooltip_ru: "Нейросеть на видеокарте: TensorRT на NVIDIA RTX, DirectML на другой карте."
  any:
    tooltip: "Where BM3D and the neural networks of the preset of the profile run. Auto: on the video card when there is one that works, else on the CPU."
    tooltip_ru: "Где работают BM3D и нейросети пресета профиля. Авто: на видеокарте, когда есть рабочая, иначе на процессоре."
    options:
      cpu:
        tooltip: "BM3D and the networks on the CPU."
        tooltip_ru: "BM3D и нейросети на процессоре."
      gpu:
        tooltip: "BM3D through Vulkan, the networks through TensorRT on NVIDIA RTX or DirectML on another card."
        tooltip_ru: "BM3D через Vulkan, нейросети через TensorRT на NVIDIA RTX или DirectML на другой карте."

paths:
  input: "input"
  output: "output"
  logs: "logs"
  report: "report"
  config: "config"

_shared_fields:
  noise: &noise
    id: noise
    type: "radio"
    choice_style: "buttons"
    label: "Noise"
    label_ru: "Шум"
    tooltip: "Auto: the strength follows the noise measured in the source and never goes below the setting. Fixed: the setting as it is."
    tooltip_ru: "Авто: сила следует за шумом, измеренным в исходнике, и не опускается ниже настройки. Как задано: настройка как есть."
    default: "auto"
    options:
      - {value: "auto", label: "Auto", label_ru: "Авто"}
      - {value: "fixed", label: "Fixed", label_ru: "Как задано"}

  intensity: &intensity
    id: intensity
    type: "number"
    label: "Intensity"
    label_ru: "Интенсивность"
    tooltip: "The strength of the whole look: 0 - off, 1 - as tuned, 2 - heavy."
    tooltip_ru: "Сила всего образа: 0 - выключен, 1 - как настроен, 2 - сильно."
    default: 1.0
    min: 0.0
    max: 2.0
    step: 0.05

  deband_y: &deband_y
    id: y
    type: "number"
    label: "Y threshold"
    label_ru: "Порог Y"
    tooltip: "neo_f3kdb threshold of the luma: how strong a step of brightness is still smoothed."
    tooltip_ru: "Порог neo_f3kdb по яркости: какой перепад яркости ещё сглаживается."
    default: 48
    min: 0
    max: 128
    step: 1

  deband_cb: &deband_cb
    id: cb
    type: "number"
    label: "Cb threshold"
    label_ru: "Порог Cb"
    tooltip: "neo_f3kdb threshold of the blue-difference colour plane."
    tooltip_ru: "Порог neo_f3kdb по цветоразностной плоскости Cb."
    default: 32
    min: 0
    max: 128
    step: 1

  deband_cr: &deband_cr
    id: cr
    type: "number"
    label: "Cr threshold"
    label_ru: "Порог Cr"
    tooltip: "neo_f3kdb threshold of the red-difference colour plane."
    tooltip_ru: "Порог neo_f3kdb по цветоразностной плоскости Cr."
    default: 32
    min: 0
    max: 128
    step: 1

  blksize: &blksize
    id: blksize
    type: "radio"
    choice_style: "buttons"
    label: "Block size"
    label_ru: "Размер блока"
    tooltip: "The block of the motion search: 16 for SD and HD, 8 for fine detail and 4K."
    tooltip_ru: "Блок поиска движения: 16 для SD и HD, 8 для мелкой детали и 4K."
    default: "16"
    options:
      - {value: "8", label: "8", label_ru: "8"}
      - {value: "16", label: "16", label_ru: "16"}

  # The fields of the machine, the same for every preset: set on one page, they are set on all.
  machine: &machine
    - id: vs_accel
      type: "radio"
      choice_style: "buttons"
      group: "processing"
      label: "Processing"
      label_ru: "Обработка"
      tooltip: "Where BM3D runs. Auto: on the video card when VapourSynth sees a working Vulkan device, else on the CPU. The other filters always run on the CPU."
      tooltip_ru: "Где работает BM3D. Авто: на видеокарте, когда VapourSynth видит рабочее устройство Vulkan, иначе на процессоре. Остальные фильтры всегда идут на процессоре."
      default: "auto"
      options:
        - {value: "auto", label: "Auto", label_ru: "Авто"}
        - {value: "cpu", label: "CPU", label_ru: "Процессор", tooltip: "BM3D on the CPU: bm3d (or bm3dcpu where it loads).", tooltip_ru: "BM3D на процессоре: bm3d (или bm3dcpu, где он загружается)."}
        - {value: "gpu", label: "GPU", label_ru: "Видеокарта", tooltip: "BM3D on the video card through Vulkan (bm3dvk), any maker; the CPU when there is no Vulkan device.", tooltip_ru: "BM3D на видеокарте через Vulkan (bm3dvk), любой производитель; процессор, когда устройства Vulkan нет."}

    - id: encode_family
      type: "radio"
      choice_style: "cards"
      group: "encoding"
      refresh_on_change: true
      label: "Codec"
      label_ru: "Кодек"
      tooltip: "What the result is written with."
      tooltip_ru: "Чем записывается результат."
      default: "x264"
      options:
        - {value: "x264", label: "x.264", label_ru: "x.264", tone: "lossy"}
        - {value: "x265", label: "x.265", label_ru: "x.265", tone: "lossy"}
        - {value: "prores", label: "ProRes", label_ru: "ProRes", tone: "lossless"}
        - {value: "dnxhr", label: "DNxHR", label_ru: "DNxHR", tone: "lossless"}

    - id: encode_backend
      type: "radio"
      choice_style: "buttons"
      group: "encoding"
      label: "Encoder"
      label_ru: "Кодер"
      tooltip: "The CPU or the hardware encoder of the video card. A hardware one this machine has not passed (SERVICE - Hardware capabilities) is off."
      tooltip_ru: "Процессор или аппаратный кодер видеокарты. Аппаратный, не прошедший проверку на этой машине (СЕРВИС - Возможности оборудования), выключен."
      default: "cpu"
      visible_if: {encode_family: ["x264", "x265"]}
      options:
        - {value: "cpu", label: "CPU", label_ru: "Процессор"}
        - {value: "nvenc", label: "NVIDIA", label_ru: "NVIDIA"}
        - {value: "qsv", label: "QuickSync", label_ru: "QuickSync", tooltip: "Intel QuickSync: the hardware encoder of Intel graphics.", tooltip_ru: "Intel QuickSync: аппаратный кодер графики Intel."}
        - {value: "amf", label: "AMF", label_ru: "AMF"}

    - id: encode_quality
      type: "radio"
      choice_style: "buttons"
      group: "encoding"
      label: "Quality"
      label_ru: "Качество"
      tooltip: "14 - near lossless, for the archive; 17 - almost invisible losses; 21 - web, proxy, preview."
      tooltip_ru: "14 - почти без потерь, для архива; 17 - потери почти незаметны; 21 - веб, прокси, просмотр."
      default: "14"
      visible_if: {encode_family: ["x264", "x265"]}
      options:
        - {value: "14", label: "14", label_ru: "14"}
        - {value: "17", label: "17", label_ru: "17"}
        - {value: "21", label: "21", label_ru: "21"}

    - id: encode_container
      type: "radio"
      choice_style: "buttons"
      group: "encoding"
      label: "Container"
      label_ru: "Контейнер"
      tooltip: "The file x.264 and x.265 are written into."
      tooltip_ru: "Файл, в который пишутся x.264 и x.265."
      default: "mp4"
      visible_if: {encode_family: ["x264", "x265"]}
      options:
        - {value: "mp4", label: "MP4", label_ru: "MP4"}
        - {value: "mkv", label: "MKV", label_ru: "MKV"}

    - id: prores_profile
      type: "radio"
      choice_style: "buttons"
      group: "encoding"
      label: "ProRes profile"
      label_ru: "Профиль ProRes"
      tooltip: "LT is enough for grading; HQ for keying and repeated passes."
      tooltip_ru: "LT достаточно для грейдинга; HQ - для кеинга и повторных проходов."
      default: "lt"
      visible_if: {encode_family: "prores"}
      options:
        - {value: "lt", label: "LT", label_ru: "LT"}
        - {value: "422", label: "422", label_ru: "422"}
        - {value: "hq", label: "HQ", label_ru: "HQ"}

    - id: prores_wrapper
      type: "radio"
      choice_style: "buttons"
      group: "encoding"
      label: "Wrapper"
      label_ru: "Обёртка"
      tooltip: "MOV for Resolve and Final Cut; MXF for Premiere and Avid."
      tooltip_ru: "MOV для Resolve и Final Cut; MXF для Premiere и Avid."
      default: "mov"
      visible_if: {encode_family: "prores"}
      options:
        - {value: "mov", label: "MOV", label_ru: "MOV"}
        - {value: "mxf", label: "MXF", label_ru: "MXF"}

    - id: dnxhr_profile
      type: "radio"
      choice_style: "buttons"
      group: "encoding"
      label: "DNxHR profile"
      label_ru: "Профиль DNxHR"
      tooltip: "LB - low bandwidth, SQ - standard, HQ - high quality, HQX - 10 bit."
      tooltip_ru: "LB - низкий поток, SQ - стандарт, HQ - высокое качество, HQX - 10 бит."
      default: "hq"
      visible_if: {encode_family: "dnxhr"}
      options:
        - {value: "hq", label: "HQ", label_ru: "HQ"}
        - {value: "hqx", label: "HQX", label_ru: "HQX"}
        - {value: "lb", label: "LB", label_ru: "LB"}
        - {value: "sq", label: "SQ", label_ru: "SQ"}

    - id: overwrite
      type: "checkbox"
      group: "run"
      label: "Overwrite"
      label_ru: "Перезаписать"
      tooltip: "Make the result again where it is already there. Off: a file that is already done is passed over."
      tooltip_ru: "Сделать результат заново там, где он уже есть. Выключено: готовый файл пропускается."
      default: false

operation_groups:
  # ==================================================================================================================
  - id: precision
    title: "PRECISION"
    title_ru: "ТОЧНОСТЬ"
    parameters: {palette: "precision"}
    fields: *machine
    children:
      - id: mild_denoise
        title: "Mild Denoise"
        title_ru: "Мягкий шумодав"
        about: "Any noise, any machine"
        about_ru: "Любой шум, любая машина"
        description: "Spectral denoise with DFTTest on the CPU."
        description_ru: "Спектральный шумодав DFTTest на процессоре."
        service: "system_core.services.vs_service:run_preset"
        fields:
          - id: strength
            type: "radio"
            choice_style: "buttons"
            label: "Strength"
            label_ru: "Сила"
            tooltip: "DFTTest sigma: light 4, medium 8, strong 14."
            tooltip_ru: "Сигма DFTTest: слабо 4, средне 8, сильно 14."
            default: "medium"
            options:
              - {value: "light", label: "Light", label_ru: "Слабо"}
              - {value: "medium", label: "Medium", label_ru: "Средне"}
              - {value: "strong", label: "Strong", label_ru: "Сильно"}
          - *noise

      - id: shadow_denoise_sota
        title: "Shadow Denoise SOTA"
        title_ru: "Шумодав теней SOTA"
        about: "BM3D in the shadows only"
        about_ru: "BM3D только в тенях"
        description: "BM3D on float, held to the shadows by a luma mask; micro-grain put back so the shadows are not plastic."
        description_ru: "BM3D в плавающей точке, удержанный в тенях маской яркости; микрозерно возвращается, чтобы тени не были пластиковыми."
        accel: "bm3d"
        service: "system_core.services.vs_service:run_preset"
        fields:
          - id: sigma
            type: "number"
            label: "BM3D sigma"
            label_ru: "Сигма BM3D"
            tooltip: "BM3D strength on the luma; the colour gets 0.6 of it."
            tooltip_ru: "Сила BM3D по яркости; цвет получает 0,6 от неё."
            default: 2.5
            min: 1.0
            max: 4.0
            step: 0.1
          - *noise
          - id: grain_back
            type: "number"
            label: "Grain back"
            label_ru: "Возврат зерна"
            tooltip: "Micro-grain put back over the cleaned shadows; 0 - none."
            tooltip_ru: "Микрозерно поверх очищенных теней; 0 - без него."
            default: 0.6
            min: 0.0
            max: 2.0
            step: 0.05
          - id: shadow_threshold
            type: "number"
            label: "Shadow threshold"
            label_ru: "Порог теней"
            tooltip: "The brightness (0..1) where the shadows end."
            tooltip_ru: "Яркость (0..1), на которой кончаются тени."
            default: 0.2
            min: 0.0
            max: 0.5
            step: 0.01
          - id: transition
            type: "number"
            label: "Mask transition"
            label_ru: "Переход маски"
            tooltip: "How wide the smooth passage below the threshold is: the shadows are cleaned fully this far under it, less and less up to it."
            tooltip_ru: "Ширина плавного перехода под порогом: на столько ниже него тени чистятся полностью, к самому порогу - всё слабее."
            default: 0.1
            min: 0.01
            max: 0.4
            step: 0.01
          - id: preview_mask
            type: "checkbox"
            label: "Show mask"
            label_ru: "Показать маску"
            tooltip: "The result is the shadow mask itself, not the picture: for setting the threshold."
            tooltip_ru: "Результат - сама маска теней, а не картинка: для подбора порога."
            default: false

      - id: chroma_cleanup
        title: "Chroma Cleanup"
        title_ru: "Чистка цветового шума"
        about: "Colour noise only"
        about_ru: "Только цветовой шум"
        description: "DFTTest on the colour planes only: the colour noise goes, the luma is not touched."
        description_ru: "DFTTest только по цветовым плоскостям: цветовой шум уходит, яркость не трогается."
        service: "system_core.services.vs_service:run_preset"
        fields:
          - id: strength
            type: "radio"
            choice_style: "buttons"
            label: "Strength"
            label_ru: "Сила"
            tooltip: "Sigma on the colour: light 6, medium 12, strong 20."
            tooltip_ru: "Сигма по цвету: слабо 6, средне 12, сильно 20."
            default: "medium"
            options:
              - {value: "light", label: "Light", label_ru: "Слабо"}
              - {value: "medium", label: "Medium", label_ru: "Средне"}
              - {value: "strong", label: "Strong", label_ru: "Сильно"}
          - *noise

      - id: deband_safe
        title: "Deband Safe"
        title_ru: "Мягкий дебанд"
        about: "Smooth gradients, no grain"
        about_ru: "Гладкие градиенты без зерна"
        description: "neo_f3kdb lightly: the steps of gradients go, no grain is added."
        description_ru: "Лёгкий neo_f3kdb: ступени градиентов уходят, зерно не добавляется."
        service: "system_core.services.vs_service:run_preset"
        fields:
          - id: range
            type: "number"
            label: "Deband range"
            label_ru: "Радиус дебанда"
            tooltip: "How far neo_f3kdb looks for the neighbours it smooths with; larger - stronger."
            tooltip_ru: "Как далеко neo_f3kdb ищет соседей для сглаживания; больше - сильнее."
            default: 12
            min: 8
            max: 32
            step: 1
          - *deband_y
          - *deband_cb
          - *deband_cr

      - id: deband_fine_grain
        title: "Deband Fine Grain"
        title_ru: "Дебанд с тонким зерном"
        about: "Gradients and micro-texture"
        about_ru: "Градиенты и микрофактура"
        description: "neo_f3kdb, then AddGrain puts a fine texture back over the smoothed gradients."
        description_ru: "neo_f3kdb, затем AddGrain возвращает тонкую фактуру поверх сглаженных градиентов."
        service: "system_core.services.vs_service:run_preset"
        fields:
          - id: range
            type: "number"
            label: "Deband range"
            label_ru: "Радиус дебанда"
            tooltip: "How far neo_f3kdb looks for the neighbours it smooths with; larger - stronger."
            tooltip_ru: "Как далеко neo_f3kdb ищет соседей для сглаживания; больше - сильнее."
            default: 14
            min: 8
            max: 32
            step: 1
          - *deband_y
          - *deband_cb
          - *deband_cr
          - id: grain_var
            type: "number"
            label: "Grain variance"
            label_ru: "Дисперсия зерна"
            tooltip: "AddGrain variance on the luma; the colour gets 0.27 of it."
            tooltip_ru: "Дисперсия AddGrain по яркости; цвет получает 0,27 от неё."
            default: 0.6
            min: 0.0
            max: 2.0
            step: 0.05

      - id: filmic_rebuild
        title: "Filmic Rebuild"
        title_ru: "Плёночная пересборка"
        about: "Denoise, deband, grain"
        about_ru: "Шумодав, дебанд, зерно"
        description: "BM3D, then neo_f3kdb, then grain laid by brightness: the digital noise and banding go, a controlled grain comes."
        description_ru: "BM3D, затем neo_f3kdb, затем зерно по яркости: цифровой шум и полосы уходят, приходит управляемое зерно."
        accel: "bm3d"
        service: "system_core.services.vs_service:run_preset"
        fields:
          - id: sigma
            type: "number"
            label: "BM3D sigma"
            label_ru: "Сигма BM3D"
            tooltip: "BM3D strength on the luma; the colour gets 0.6 of it."
            tooltip_ru: "Сила BM3D по яркости; цвет получает 0,6 от неё."
            default: 2.0
            min: 1.0
            max: 3.5
            step: 0.1
          - *noise
          - id: deband_range
            type: "number"
            label: "Deband range"
            label_ru: "Радиус дебанда"
            tooltip: "How far neo_f3kdb looks for the neighbours it smooths with; larger - stronger."
            tooltip_ru: "Как далеко neo_f3kdb ищет соседей для сглаживания; больше - сильнее."
            default: 14
            min: 8
            max: 32
            step: 1
          - id: grain_shadow
            type: "number"
            label: "Grain in shadows"
            label_ru: "Зерно в тенях"
            tooltip: "Grain variance laid where the picture is darker than the shadow threshold."
            tooltip_ru: "Дисперсия зерна там, где картинка темнее порога теней."
            default: 1.5
            min: 0.0
            max: 3.0
            step: 0.05
          - id: grain_mid
            type: "number"
            label: "Grain in mid-tones"
            label_ru: "Зерно в средних"
            tooltip: "Grain variance laid between the two thresholds."
            tooltip_ru: "Дисперсия зерна между двумя порогами."
            default: 0.9
            min: 0.0
            max: 3.0
            step: 0.05
          - id: grain_high
            type: "number"
            label: "Grain in highlights"
            label_ru: "Зерно в светах"
            tooltip: "Grain variance laid where the picture is brighter than the highlight threshold."
            tooltip_ru: "Дисперсия зерна там, где картинка светлее порога светов."
            default: 0.4
            min: 0.0
            max: 3.0
            step: 0.05
          - id: shadow_threshold
            type: "number"
            label: "Shadow threshold"
            label_ru: "Порог теней"
            tooltip: "The brightness (0..1) where the shadows end."
            tooltip_ru: "Яркость (0..1), на которой кончаются тени."
            default: 0.3
            min: 0.0
            max: 0.5
            step: 0.01
          - id: high_threshold
            type: "number"
            label: "Highlight threshold"
            label_ru: "Порог светов"
            tooltip: "The brightness (0..1) where the highlights begin."
            tooltip_ru: "Яркость (0..1), с которой начинаются света."
            default: 0.65
            min: 0.5
            max: 1.0
            step: 0.01

      - id: archive_clean
        title: "Archive Clean"
        title_ru: "Чистый архив"
        about: "Neutral master, no grain"
        about_ru: "Нейтральный мастер без зерна"
        description: "DFTTest lightly and neo_f3kdb lightly, no grain: a neutral master for the archive."
        description_ru: "Лёгкий DFTTest и лёгкий neo_f3kdb без зерна: нейтральный мастер для архива."
        service: "system_core.services.vs_service:run_preset"
        fields:
          - id: denoise
            type: "radio"
