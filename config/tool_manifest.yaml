            label: "Model"
            label_ru: "Модель"
            tooltip: "Colour - colour video; Blocks - the blocks of JPEG and MPEG as well; Grey - the brightness alone, the colour kept as it is."
            tooltip_ru: "Цвет - цветное видео; Блоки - ещё и блоки JPEG и MPEG; Серый - только яркость, цвет остаётся как есть."
            default: "drunet_color"
            options:
              - {value: "drunet_color", label: "Colour", label_ru: "Цвет"}
              - {value: "drunet_gray", label: "Grey", label_ru: "Серый"}
              - {value: "drunet_deblocking_color", label: "Blocks, colour", label_ru: "Блоки, цвет"}
              - {value: "drunet_deblocking_gray", label: "Blocks, grey", label_ru: "Блоки, серый"}
          - id: tile
            type: "number"
            label: "Tile"
            label_ru: "Плитка"
            tooltip: "The piece of the frame the network takes at a time, in pixels: smaller - less video memory, slower."
            tooltip_ru: "Кусок кадра, который сеть берёт за раз, в пикселях: меньше - меньше видеопамяти, медленнее."
            default: 384
            min: 256
            max: 512
            step: 16

      - id: vsmlrt_realesrgan_2x
        title: "Real-ESRGAN 2x"
        title_ru: "Real-ESRGAN 2x"
        about: "A neural upscale, twice the size"
        about_ru: "Нейросетевое увеличение вдвое"
        description: "Real-ESRGAN on vs-mlrt: drawn animation twice the size, its lines clean and sharp; TensorRT on NVIDIA."
        description_ru: "Real-ESRGAN на vs-mlrt: рисованная анимация вдвое, с чистыми чёткими линиями; TensorRT на NVIDIA."
        service: "system_core.services.vs_service:run_preset"
        accel: "mlrt"
        needs: "mlrt"
        fields:
          - id: model
            type: "radio"
            choice_style: "buttons"
            label: "Model"
            label_ru: "Модель"
            tooltip: "Real-ESRGAN in vs-mlrt has models for drawn animation alone: Anime is the lightest, AnimeJaNai 1-3 go from lighter to stronger. Live action they can over-sharpen."
            tooltip_ru: "У Real-ESRGAN в vs-mlrt модели только для рисованной анимации: Аниме - самая лёгкая, AnimeJaNai 1-3 - от лёгкой к сильной. Живое видео они могут пережать по резкости."
            default: "animevideov3"
            options:
              - {value: "animevideov3", label: "Anime", label_ru: "Аниме"}
              - {value: "animejanaiV2-L1", label: "AnimeJaNai 1", label_ru: "AnimeJaNai 1"}
              - {value: "animejanaiV2-L2", label: "AnimeJaNai 2", label_ru: "AnimeJaNai 2"}
              - {value: "animejanaiV2-L3", label: "AnimeJaNai 3", label_ru: "AnimeJaNai 3"}
          - id: tile
            type: "number"
            label: "Tile"
            label_ru: "Плитка"
            tooltip: "The piece of the frame the network takes at a time, in pixels: smaller - less video memory, slower."
            tooltip_ru: "Кусок кадра, который сеть берёт за раз, в пикселях: меньше - меньше видеопамяти, медленнее."
            default: 384
